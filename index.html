<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard de Temperatura e Umidade</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Dashboard de Temperatura e Umidade</h1>
  </header>

  <main class="dashboard">
    <section class="card">
      <h2>Temperatura e Umidade por Horário</h2>
      <div class="chart-container">
        <canvas id="graficoLinhas"></canvas>
      </div>
    </section>

    <section class="card">
      <h2>Médias Mensais de Temperatura e Umidade</h2>
      <div class="chart-container">
        <canvas id="graficoBarras"></canvas>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="script.js"></script>
</body>
</html>
